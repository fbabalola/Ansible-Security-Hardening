# =============================================================================
# Handlers
# =============================================================================
# Service restarts triggered by notify directives
# =============================================================================

---
- name: restart sshd
  service:
    name: sshd
    state: restarted

- name: reload sshd
  service:
    name: sshd
    state: reloaded

- name: restart firewalld
  service:
    name: firewalld
    state: restarted

- name: restart ufw
  ufw:
    state: reloaded
