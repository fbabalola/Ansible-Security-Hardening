# =============================================================================
# Ansible Configuration
# =============================================================================
# Local config for this repo
# Overrides /etc/ansible/ansible.cfg

[defaults]
# Inventory file location
inventory = inventory/hosts

# Don't check SSH host keys (set to True in production)
host_key_checking = False

# Suppress deprecation warnings
deprecation_warnings = False

# Increase timeout for slow connections
timeout = 30

# Retry failed connections
retry_files_enabled = True

# Default user if not specified in inventory
remote_user = admin

# Use SSH pipelining for better performance
pipelining = True

[privilege_escalation]
# Use sudo by default
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH args for better performance and compatibility
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
